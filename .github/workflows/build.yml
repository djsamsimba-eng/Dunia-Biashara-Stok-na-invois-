name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true

      - name: Extract Project Files
        run: |
          unzip Business_Invoice_Stock_2027-1.zip -d app_files
          PROJ_DIR=$(find app_files -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Patch AGP Version & Build APK
        run: |
          cd ${{ env.PROJ_DIR }}

          # Rekebisha mazingira ya Android Gradle
          mkdir -p android
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.overrideVersionCheck=true" >> android/gradle.properties

          # Rekebisha matoleo ya AGP kwenye settings.gradle au build.gradle ikiwa yapo
          find android/ -type f \( -name "settings.gradle*" -o -name "build.gradle*" \) -exec sed -i 's/8\.9\.[0-9]/8.2.1/g' {} +
          find android/ -type f \( -name "settings.gradle*" -o -name "build.gradle*" \) -exec sed -i 's/9\.[0-9]\.[0-9]/8.2.1/g' {} +

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dunia-Biashara-App-APK
          path: ${{ env.PROJ_DIR }}/build/app/outputs/flutter-apk/app-release.apk
