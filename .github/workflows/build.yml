name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true

      - name: Extract Project Files
        run: |
          unzip Business_Invoice_Stock_2027-1.zip -d app_files
          PROJ_DIR=$(find app_files -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Patch AGP and Build APK
        run: |
          cd ${{ env.PROJ_DIR }}

          # 1. Weka mipangilio ya gradle.properties
          mkdir -p android
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.overrideVersionCheck=true" >> android/gradle.properties
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties

          # 2. Tumia Python kubadilisha toleo la AGP kwa usalama
          python3 -c '
          import os, re
          for root, dirs, files in os.walk("android"):
              for file in files:
                  if file.endswith((".gradle", ".kts")):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      new_content = re.sub(r"id\([\"'\']com\.android\.application[\"'\']\)\s+version\s+[\"'\'][^\"'\']+[\"'\']", "id(\"com.android.application\") version \"8.2.1\"", content)
                      new_content = re.sub(r"com\.android\.tools\.build:gradle:[^\s\"'\']+", "com.android.tools.build:gradle:8.2.1", new_content)
                      if content != new_content:
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(new_content)
          '

          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dunia-Biashara-App-APK
          path: ${{ env.PROJ_DIR }}/build/app/outputs/flutter-apk/app-release.apk
