name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true

      - name: Extract Project Files
        run: |
          unzip Business_Invoice_Stock_2027-1.zip -d app_files
          # Tafuta folda yenye pubspec.yaml na uingie humo
          PROJ_DIR=$(find app_files -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Fix Gradle & Build APK
        run: |
          cd ${{ env.PROJ_DIR }}
          
          # Hakikisha android/gradle.properties inasasishwa ipasavyo
          mkdir -p android
          touch android/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.overrideVersionCheck=true" >> android/gradle.properties

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dunia-Biashara-App-APK
          path: ${{ env.PROJ_DIR }}/build/app/outputs/flutter-apk/app-release.apk
