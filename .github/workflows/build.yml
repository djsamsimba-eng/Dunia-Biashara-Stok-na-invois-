name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract Project Files
        run: |
          unzip Business_Invoice_Stock_2027-1.zip -d app_files
          PROJ_DIR=$(find app_files -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Patch pubspec.yaml & Build APK
        run: |
          cd ${{ env.PROJ_DIR }}

          # 1. Tumia Python kurekebisha sdk constraint na kuondoa flutter_test bila kuharibu muundo
          python3 -c '
          import re
          with open("pubspec.yaml", "r") as f:
              lines = f.readlines()

          new_lines = []
          in_env = False
          for line in lines:
              if line.strip().startswith("environment:"):
                  in_env = True
                  new_lines.append(line)
                  continue
              if in_env and "sdk:" in line:
                  indent = line[:line.find("sdk:")]
                  new_lines.append(f"{indent}sdk: \">=3.0.0 <4.0.0\"\n")
                  in_env = False
                  continue
              if "flutter_test:" in line or (in_env and line.strip() and not line.startswith(" ") and not line.startswith("\t")):
                  in_env = False
              if "flutter_test:" not in line and "sdk: flutter" not in line:
                  new_lines.append(line)

          with open("pubspec.yaml", "w") as f:
              f.writelines(new_lines)
          '

          # 2. Weka mipangilio ya gradle.properties
          mkdir -p android
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.overrideVersionCheck=true" >> android/gradle.properties

          # 3. Pakua packages na build APK
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dunia-Biashara-App-APK
          path: ${{ env.PROJ_DIR }}/build/app/outputs/flutter-apk/app-release.apk
