name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Unzip Project Files
        run: |
          unzip Business_Invoice_Stock_2027-1.zip -d app_files

      - name: Get Dependencies & Build APK
        run: |
          cd app_files
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dunia-Biashara-App-APK
          path: app_files/build/app/outputs/flutter-apk/app-release.apk
