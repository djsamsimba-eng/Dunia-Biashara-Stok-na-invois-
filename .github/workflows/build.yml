name: Build APK from Zip

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip Business_Invoice_Stock_2027-1.zip -d app_files
          echo "Files extracted successfully:"
          ls -la app_files

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Find and Build Gradle / Android Project
        run: |
          cd app_files
          # Kama mradi una inner folder, ingia humo
          if [ -d "$(ls -d */ | head -n 1)" ]; then
            cd "$(ls -d */ | head -n 1)"
          fi
          
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "No gradlew found directly, searching..."
            find . -name "gradlew" -exec chmod +x {} \;
            find . -name "gradlew" -execdir ./gradlew assembleDebug \;
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
