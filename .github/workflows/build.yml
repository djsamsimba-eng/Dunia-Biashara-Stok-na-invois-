name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true

      - name: Unzip Project Files
        run: |
          unzip Business_Invoice_Stock_2027-1.zip -d app_files

      - name: Patch AGP and Build APK
        run: |
          cd app_files
          mkdir -p android
          
          # Weka mipangilio ya kuzuia newDsl na makosa ya Gradle
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties

          flutter pub get
          flutter build apk --release --suppress-analytics

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dunia-Biashara-App-APK
          path: app_files/build/app/outputs/flutter-apk/app-release.apk
