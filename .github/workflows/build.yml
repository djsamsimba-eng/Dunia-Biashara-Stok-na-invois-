name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          cache: true

      - name: Extract Project Files
        run: |
          unzip Business_Invoice_Stock_2027-1.zip -d app_files
          PROJ_DIR=$(find app_files -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Patch pubspec.yaml & Build APK
        run: |
          cd ${{ env.PROJ_DIR }}

          # 1. Tengeneza skripti ya kurekebisha sdk constraint pekee
          cat << 'EOF' > patch_pubspec.py
          import re

          with open("pubspec.yaml", "r") as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              if re.match(r"^\s*sdk:\s*[\"']?[^\"'\n]+[\"']?", line) and "flutter" not in line:
                  indent = line[:line.find("sdk:")]
                  new_lines.append(f'{indent}sdk: ">=3.0.0 <4.0.0"\n')
              else:
                  new_lines.append(line)

          with open("pubspec.yaml", "w") as f:
              f.writelines(new_lines)
          EOF

          python3 patch_pubspec.py

          # 2. Weka flag za kuzuia AGP 9 kwenye gradle.properties zote mbili (root na android/)
          mkdir -p android
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.overrideVersionCheck=true" >> android/gradle.properties
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties

          echo "android.newDsl=false" >> gradle.properties
          echo "android.overrideVersionCheck=true" >> gradle.properties

          # 3. Fetch dependencies na build APK kwa kulinganisha flags za AGP
          flutter pub get
          flutter build apk --release --no-tree-shake-icons --Pandroid.newDsl=false -Pandroid.overrideVersionCheck=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dunia-Biashara-App-APK
          path: ${{ env.PROJ_DIR }}/build/app/outputs/flutter-apk/app-release.apk
