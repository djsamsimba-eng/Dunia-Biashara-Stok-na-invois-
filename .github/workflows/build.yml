name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true

      - name: Extract Project Files
        run: |
          unzip Business_Invoice_Stock_2027-1.zip -d app_files
          PROJ_DIR=$(find app_files -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Downgrade AGP & Build APK
        run: |
          cd ${{ env.PROJ_DIR }}

          # 1. Hakikisha gradle.properties inazuia newDsl
          mkdir -p android
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.overrideVersionCheck=true" >> android/gradle.properties
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties

          # 2. Badilisha toleo la AGP 9.x au lipo juu kwenda 8.2.1 kwenye settings.gradle.kts au build.gradle.kts
          find android/ -type f \( -name "*.gradle*" -o -name "*.kts" \) -exec sed -i 's/9\.[0-9]\.[0-9][a-zA-Z0-9-.]*/8.2.1/g' {} +
          find android/ -type f \( -name "*.gradle*" -o -name "*.kts" \) -exec sed -i 's/8\.9\.[0-9][a-zA-Z0-9-.]*/8.2.1/g' {} +

          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dunia-Biashara-App-APK
          path: ${{ env.PROJ_DIR }}/build/app/outputs/flutter-apk/app-release.apk
