name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract Project Files
        run: |
          unzip Business_Invoice_Stock_2027-1.zip -d app_files
          PROJ_DIR=$(find app_files -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Patch pubspec.yaml & Build APK
        run: |
          cd ${{ env.PROJ_DIR }}

          # 1. Rekebisha takwa la SDK na uondoe au kurekebisha flutter_test
          python3 -c '
          with open("pubspec.yaml", "r") as f:
              content = f.read()
          import re
          content = re.sub(r"sdk:\s*[\"'\']?[\^>=]*3\.[0-9]+\.[0-9]+[\"'\']?", "sdk: \">=3.0.0 <4.0.0\"", content)
          # Ondoa utegemezi wa flutter_test unaosababisha mgogoro
          content = re.sub(r"^\s*flutter_test:\s*\n\s*sdk:\s*flutter\s*$", "", content, flags=re.MULTILINE)
          with open("pubspec.yaml", "w") as f:
              f.write(content)
          '

          # 2. Weka mipangilio ya gradle
          mkdir -p android
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.overrideVersionCheck=true" >> android/gradle.properties

          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dunia-Biashara-App-APK
          path: ${{ env.PROJ_DIR }}/build/app/outputs/flutter-apk/app-release.apk
